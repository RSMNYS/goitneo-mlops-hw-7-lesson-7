apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: namespaces-appset
  namespace: infra-tools
spec:
  generators:
  - git:
      repoURL: https://github.com/RSMNYS/goit-argo.git
      revision: main
      directories:
      - path: namespaces/*

  template:
    metadata:
      name: 'ns-{{path.basename}}'
      namespace: infra-tools

    spec:
      project: default

      source:
        repoURL: https://github.com/RSMNYS/goit-argo.git
        targetRevision: main
        path: '{{path}}'
        directory:
          recurse: true

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true

      revisionHistoryLimit: 2
