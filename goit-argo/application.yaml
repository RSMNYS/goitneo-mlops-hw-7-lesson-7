apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: infra-tools
spec:
  project: default

  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: mlflow
    targetRevision: 0.7.19

    helm:
      values: |
        image:
          repository: ghcr.io/mlflow/mlflow
          tag: v2.9.2

        backendStore:
          postgres:
            enabled: false

        artifactRoot:
          s3:
            enabled: false

        service:
          type: ClusterIP
          port: 5000

        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: application

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
